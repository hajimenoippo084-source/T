
name: Compilar THRILL KILL APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Instalar Android Build Tools
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas de compilación
        run: |
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Descompilar APK
        run: apktool d app-debug.apk -o decoded -f

      - name: Reconstruir APK
        run: apktool b decoded -o app-unsigned.apk

      - name: Firmar APK
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 app-unsigned.apk app-aligned.apk
          "$BT/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out THRILL-KILL-MOD.apk app-aligned.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: THRILL-KILL-MOD
          path: THRILL-KILL-MOD.apk
          

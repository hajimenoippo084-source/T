
name: Compilar THRILL KILL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar Build Tools
        run: |
          sdkmanager "build-tools;35.0.0"

      - name: Comprobar APK
        run: |
          ls -lh
          test -f THRILL-KILL-ANDROID-MENU-MUSIC.apk

      - name: Descompilar APK
        run: |
          apktool d THRILL-KILL-ANDROID-MENU-MUSIC.apk -o decoded -f

      - name: Reconstruir APK
        run: |
          apktool b decoded -o app-unsigned.apk

      - name: Crear firma
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Alinear APK
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 app-unsigned.apk app-aligned.apk

      - name: Firmar APK
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out THRILL-KILL-MOD.apk app-aligned.apk

      - name: Verificar firma
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify THRILL-KILL-MOD.apk

      - name: Descargar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: THRILL-KILL-MOD
          path: THRILL-KILL-MOD.apk
          

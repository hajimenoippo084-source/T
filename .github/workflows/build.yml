
name: Compilar THRILL KILL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar APKTool 3.0.3
        run: |
          curl -L \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            -o apktool.jar

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: build-tools;35.0.0

      - name: Comprobar APK
        run: |
          ls -lh
          test -f THRILL-KILL-ANDROID-MENU-MUSIC.apk

      - name: Descompilar APK
        run: |
          java -jar apktool.jar d \
            THRILL-KILL-ANDROID-MENU-MUSIC.apk \
            -o decoded -f

      - name: Reconstruir APK
        run: |
          java -jar apktool.jar b decoded \
            -o app-unsigned.apk

      - name: Crear firma
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Alinear APK
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 app-unsigned.apk app-aligned.apk

      - name: Firmar APK
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out THRILL-KILL-MOD.apk app-aligned.apk

      - name: Verificar APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify THRILL-KILL-MOD.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: THRILL-KILL-MOD
          path: THRILL-KILL-MOD.apk
          
